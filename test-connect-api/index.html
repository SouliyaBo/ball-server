<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Connect to Football API</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .api-info {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .api-info h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .result-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            min-height: 200px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #c62828;
            margin-bottom: 20px;
        }

        .success {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #2e7d32;
            margin-bottom: 20px;
        }

        .json-display {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .endpoint-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .endpoint-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .endpoint-card h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .endpoint-card code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .response-time {
            background: #e3f2fd;
            color: #1976d2;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            display: inline-block;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-plug"></i> Test API Connection</h1>
            <p>ทดสอบการเชื่อมต่อและดึงข้อมูลจาก Football Data API</p>
        </div>

        <div class="api-info">
            <h3><i class="fas fa-info-circle"></i> ข้อมูล API Server</h3>
            <div class="endpoint-info">
                <div class="endpoint-card">
                    <h4>🌐 API Base URL</h4>
                    <code id="apiBaseUrl">http://localhost:3001</code>
                </div>
                <div class="endpoint-card">
                    <h4>📚 API Documentation</h4>
                    <code>GET /</code>
                </div>
                <div class="endpoint-card">
                    <h4>🏥 Health Check</h4>
                    <code>GET /api/health</code>
                </div>
                <div class="endpoint-card">
                    <h4>📊 Server Status</h4>
                    <code>GET /api/status</code>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="testConnection()">
                <i class="fas fa-link"></i> ทดสอบการเชื่อมต่อ
            </button>
            <button class="btn" onclick="getApiDocumentation()">
                <i class="fas fa-book"></i> ดูเอกสาร API
            </button>
            <button class="btn" onclick="getHealthCheck()">
                <i class="fas fa-heartbeat"></i> ตรวจสุขภาพ Server
            </button>
            <button class="btn" onclick="getServerStatus()">
                <i class="fas fa-server"></i> สถานะ Server
            </button>
            <button class="btn" onclick="getAllTests()">
                <i class="fas fa-tasks"></i> ทดสอบทั้งหมด
            </button>
        </div>

        <div id="stats" class="stats-grid" style="display: none;">
            <!-- Stats will be populated by JavaScript -->
        </div>

        <div class="result-container">
            <div id="result">
                <div style="text-align: center; padding: 40px; color: #666;">
                    <i class="fas fa-rocket" style="font-size: 3rem; margin-bottom: 20px; color: #667eea;"></i>
                    <h3>พร้อมทดสอบ API</h3>
                    <p>กดปุ่มด้านบนเพื่อเริ่มทดสอบการเชื่อมต่อ API</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3001';
        let testResults = {
            connection: null,
            documentation: null,
            health: null,
            status: null,
            responseTime: {}
        };

        // แสดง loading
        function showLoading(message = 'กำลังโหลดข้อมูล...') {
            document.getElementById('result').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    ${message}
                </div>
            `;
        }

        // แสดงผลลัพธ์
        function showResult(title, data, isError = false, responseTime = null) {
            const resultDiv = document.getElementById('result');
            const statusClass = isError ? 'error' : 'success';
            const statusText = isError ? 'ข้อผิดพลาด' : 'สำเร็จ';
            const icon = isError ? 'fas fa-exclamation-triangle' : 'fas fa-check-circle';

            let responseTimeHtml = '';
            if (responseTime !== null) {
                responseTimeHtml = `<div class="response-time">เวลาตอบกลับ: ${responseTime}ms</div>`;
            }

            resultDiv.innerHTML = `
                <div class="${statusClass}">
                    <i class="${icon}"></i> ${statusText}: ${title}
                    ${responseTimeHtml}
                </div>
                <div class="json-display">${typeof data === 'string' ? data : JSON.stringify(data, null, 2)}</div>
            `;
        }

        // ทำ API request
        async function makeApiRequest(endpoint, description) {
            const url = `${API_BASE_URL}${endpoint}`;
            const startTime = Date.now();

            try {
                console.log(`🔄 กำลังเรียก: ${url}`);
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });

                const endTime = Date.now();
                const responseTime = endTime - startTime;
                testResults.responseTime[endpoint] = responseTime;

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log(`✅ สำเร็จ: ${description}`, data);

                return { success: true, data, responseTime };
            } catch (error) {
                const endTime = Date.now();
                const responseTime = endTime - startTime;
                console.error(`❌ ข้อผิดพลาด: ${description}`, error);

                return {
                    success: false,
                    error: error.message,
                    responseTime
                };
            }
        }

        // ทดสอบการเชื่อมต่อพื้นฐาน
        async function testConnection() {
            showLoading('กำลังทดสอบการเชื่อมต่อ...');

            const result = await makeApiRequest('/api/test', 'ทดสอบการเชื่อมต่อ');
            testResults.connection = result;

            if (result.success) {
                showResult('การเชื่อมต่อ API', result.data, false, result.responseTime);
            } else {
                showResult('การเชื่อมต่อ API ล้มเหลว', result.error, true, result.responseTime);
            }
        }

        // ดูเอกสาร API
        async function getApiDocumentation() {
            showLoading('กำลังดึงเอกสาร API...');

            const result = await makeApiRequest('/', 'เอกสาร API');
            testResults.documentation = result;

            if (result.success) {
                showResult('เอกสาร API', result.data, false, result.responseTime);
            } else {
                showResult('ไม่สามารถดึงเอกสาร API ได้', result.error, true, result.responseTime);
            }
        }

        // ตรวจสุขภาพ Server
        async function getHealthCheck() {
            showLoading('กำลังตรวจสุขภาพ Server...');

            const result = await makeApiRequest('/api/health', 'ตรวจสุขภาพ Server');
            testResults.health = result;

            if (result.success) {
                showResult('สุขภาพ Server', result.data, false, result.responseTime);
            } else {
                showResult('ไม่สามารถตรวจสุขภาพ Server ได้', result.error, true, result.responseTime);
            }
        }

        // ดูสถานะ Server
        async function getServerStatus() {
            showLoading('กำลังดึงสถานะ Server...');

            const result = await makeApiRequest('/api/status', 'สถานะ Server');
            testResults.status = result;

            if (result.success) {
                showResult('สถานะ Server', result.data, false, result.responseTime);
                updateStats(result.data);
            } else {
                showResult('ไม่สามารถดึงสถานะ Server ได้', result.error, true, result.responseTime);
            }
        }

        // อัปเดตสถิติ
        function updateStats(statusData) {
            const statsDiv = document.getElementById('stats');
            const uptime = Math.floor(statusData.uptime || 0);
            const hours = Math.floor(uptime / 3600);
            const minutes = Math.floor((uptime % 3600) / 60);
            const seconds = uptime % 60;

            const memoryUsage = statusData.memory ? (statusData.memory.heapUsed / 1024 / 1024).toFixed(2) : 0;
            const cacheEntries = statusData.cache ? statusData.cache.entries : 0;
            const avgResponseTime = Object.values(testResults.responseTime).length > 0
                ? Math.round(Object.values(testResults.responseTime).reduce((a, b) => a + b, 0) / Object.values(testResults.responseTime).length)
                : 0;

            statsDiv.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}</div>
                    <div class="stat-label">Server Uptime</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${memoryUsage} MB</div>
                    <div class="stat-label">Memory Usage</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${cacheEntries}</div>
                    <div class="stat-label">Cache Entries</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${avgResponseTime}ms</div>
                    <div class="stat-label">Avg Response Time</div>
                </div>
            `;
            statsDiv.style.display = 'grid';
        }

        // ทดสอบทั้งหมด
        async function getAllTests() {
            showLoading('กำลังทดสอบทุก endpoint...');

            const tests = [
                { func: testConnection, name: 'การเชื่อมต่อ' },
                { func: getApiDocumentation, name: 'เอกสาร API' },
                { func: getHealthCheck, name: 'สุขภาพ Server' },
                { func: getServerStatus, name: 'สถานะ Server' }
            ];

            let allResults = [];

            for (const test of tests) {
                try {
                    if (test.name === 'การเชื่อมต่อ') {
                        const result = await makeApiRequest('/api/test', test.name);
                        allResults.push({ name: test.name, result });
                    } else if (test.name === 'เอกสาร API') {
                        const result = await makeApiRequest('/', test.name);
                        allResults.push({ name: test.name, result });
                    } else if (test.name === 'สุขภาพ Server') {
                        const result = await makeApiRequest('/api/health', test.name);
                        allResults.push({ name: test.name, result });
                    } else if (test.name === 'สถานะ Server') {
                        const result = await makeApiRequest('/api/status', test.name);
                        allResults.push({ name: test.name, result });
                        if (result.success) {
                            updateStats(result.data);
                        }
                    }
                } catch (error) {
                    allResults.push({
                        name: test.name,
                        result: { success: false, error: error.message }
                    });
                }
            }

            // แสดงผลรวม
            const summary = {
                total: allResults.length,
                passed: allResults.filter(r => r.result.success).length,
                failed: allResults.filter(r => r.result.success === false).length,
                results: allResults
            };

            showResult('ผลการทดสอบทั้งหมด', summary, summary.failed > 0);
        }

        // อัปเดต API Base URL ใน UI
        document.getElementById('apiBaseUrl').textContent = API_BASE_URL;

        // เริ่มต้นด้วยการทดสอบการเชื่อมต่อ
        window.addEventListener('load', () => {
            console.log('🚀 Football Data API Tester พร้อมใช้งาน');
            console.log('📡 API Base URL:', API_BASE_URL);
        });
    </script>
</body>

</html>
