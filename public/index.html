<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลบอลสด - Football Results</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            font-weight: 400;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            color: #333;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            background: white;
        }

        .btn.active {
            background: #4CAF50;
            color: white;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin: 50px 0;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .leagues-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .league-card {
            background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .league-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            border-color: #ffd700;
        }

        .league-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .league-trophy {
            color: #ffd700;
            font-size: 1.5rem;
        }

        .league-priority {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .league-content {
            text-align: center;
            margin: 20px 0;
        }

        .league-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .league-name-en {
            font-size: 0.9rem;
            color: #666;
            margin: 5px 0;
        }

        .league-code {
            font-size: 0.85rem;
            color: #888;
            margin-top: 5px;
        }

        .league-footer {
            text-align: center;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .league-status {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .league-status.active {
            color: #27ae60;
        }

        .league-status.inactive {
            color: #e74c3c;
        }

        .league-group {
            margin-bottom: 40px;
        }

        .league-group-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .league-group-header:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .league-group-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .league-group-name h3 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .league-group-name p {
            margin: 5px 0 0 0;
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .league-group-count {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 1rem;
        }

        .league-group-priority {
            opacity: 0.7;
            font-size: 0.8rem;
            margin-top: 3px;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .match-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .match-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .match-time {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .match-status {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-ft {
            background: #4CAF50;
            color: white;
        }

        .status-live {
            background: #FF5722;
            color: white;
            animation: pulse 2s infinite;
        }

        .status-scheduled {
            background: #FFC107;
            color: #333;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }

            100% {
                opacity: 1;
            }
        }

        .teams-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        .team {
            flex: 1;
            text-align: center;
        }

        .team-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
            color: #333;
        }

        .team-flag {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .score-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 20px;
        }

        .score {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
            margin: 5px 0;
        }

        .vs {
            color: #999;
            font-size: 14px;
            font-weight: 500;
        }

        .no-matches {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin: 50px 0;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .search-container {
            max-width: 400px;
            margin: 0 auto 30px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .search-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: #667eea;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .search-btn:hover {
            background: #5a67d8;
        }

        .league-badge {
            display: inline-block;
            background: #f8f9fa;
            color: #495057;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .matches-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                gap: 10px;
            }

            .btn {
                padding: 10px 15px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-futbol"></i> ผลบอลสด</h1>
            <p>ข้อมูลผลการแข่งขันฟุตบอลแบบเรียลไทม์</p>
        </div>

        <div class="search-container">
            <input type="text" class="search-input" placeholder="ค้นหาทีม เช่น Brazil, Thailand..." id="searchInput">
            <button class="search-btn" onclick="searchTeam()">
                <i class="fas fa-search"></i>
            </button>
        </div>

        <div class="controls">
            <button class="btn active" onclick="showTodayMatches()">
                <i class="fas fa-calendar-day"></i> แมตช์วันนี้
            </button>
            <button class="btn" onclick="showTodayMatchesByLeague()">
                <i class="fas fa-layer-group"></i> จัดกลุ่มตามลีก
            </button>
            <button class="btn" onclick="showLiveMatches()">
                <i class="fas fa-broadcast-tower"></i> แมตช์สด
            </button>
            <button class="btn" onclick="showFinishedMatches()">
                <i class="fas fa-check-circle"></i> เสร็จแล้ว
            </button>
            <button class="btn" onclick="showScheduledMatches()">
                <i class="fas fa-clock"></i> ยังไม่เริ่ม
            </button>
            <button class="btn" onclick="showUpcomingMatches()">
                <i class="fas fa-calendar-week"></i> สัปดาห์หน้า
            </button>
            <button class="btn" onclick="showLeagues()">
                <i class="fas fa-trophy"></i> ลีก
            </button>
            <button class="btn" onclick="showStats()">
                <i class="fas fa-chart-bar"></i> สถิติ
            </button>
            <button class="btn" onclick="exportData()">
                <i class="fas fa-download"></i> ส่งออก
            </button>
        </div>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                กำลังโหลดข้อมูล...
            </div>
        </div>
    </div>

    <script>
        let allMatches = [];
        let currentView = 'today';

        // โหลดข้อมูลเมื่อเริ่มต้น
        document.addEventListener('DOMContentLoaded', function () {
            showTodayMatches();
        });

        // ฟังก์ชันหลักสำหรับดึงข้อมูล
        async function fetchData(endpoint) {
            try {
                const response = await fetch(endpoint);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching data:', error);
                return null;
            }
        }

        // แสดงแมตช์วันนี้
        async function showTodayMatches() {
            setActiveButton(event?.target || document.querySelector('.btn'));
            showLoading();
            currentView = 'today';

            try {
                const response = await fetch('/api/matches/today');
                const matches = await response.json();
                allMatches = matches;
                displayMatches(matches, 'แมตช์วันนี้');
            } catch (error) {
                showError('ไม่สามารถโหลดข้อมูลได้');
            }
        }

        // แสดงแมตช์สด
        async function showLiveMatches() {
            setActiveButton(event?.target);
            showLoading();
            currentView = 'live';

            try {
                const response = await fetch('/api/matches/live');
                const matches = await response.json();
                displayMatches(matches, 'แมตช์สด');
            } catch (error) {
                showError('ไม่สามารถโหลดข้อมูลได้');
            }
        }

        // แสดงแมตช์ที่เสร็จแล้ว
        async function showFinishedMatches() {
            setActiveButton(event?.target);
            showLoading();
            currentView = 'finished';

            const finishedMatches = allMatches.filter(match =>
                match.status === 'FT' || match.status === 'finished'
            );
            displayMatches(finishedMatches, 'แมตช์ที่เสร็จแล้ว');
        }

        // แสดงแมตช์ที่ยังไม่เริ่ม
        async function showScheduledMatches() {
            setActiveButton(event?.target);
            showLoading();
            currentView = 'scheduled';

            const scheduledMatches = allMatches.filter(match =>
                match.status === 'scheduled' || match.status === 'NS'
            );
            displayMatches(scheduledMatches, 'แมตช์ที่ยังไม่เริ่ม');
        }

        // แสดงแมตช์สัปดาห์หน้า
        async function showUpcomingMatches() {
            setActiveButton(event?.target);
            showLoading();
            currentView = 'upcoming';

            try {
                const response = await fetch('/api/matches/upcoming?days=7');
                if (!response.ok) throw new Error('Network response was not ok');

                const upcomingMatches = await response.json();

                // จัดกลุ่มแมตช์ตามวันที่
                const groupedMatches = groupMatchesByDate(upcomingMatches);
                displayGroupedMatches(groupedMatches, 'แมตช์ 7 วันข้างหน้า');

            } catch (error) {
                console.error('Error fetching upcoming matches:', error);
                showError('ไม่สามารถดึงข้อมูลแมตช์ข้างหน้าได้');
            }
        }

        // แสดงข้อมูลลีก
        async function showLeagues() {
            setActiveButton(event?.target);
            showLoading();
            currentView = 'leagues';

            try {
                const response = await fetch('/api/leagues/top?limit=50');
                if (!response.ok) throw new Error('Network response was not ok');

                const leagues = await response.json();
                displayLeagues(leagues, 'ลีกยอดนิยม');

            } catch (error) {
                console.error('Error fetching leagues:', error);
                showError('ไม่สามารถดึงข้อมูลลีกได้');
            }
        }

        // แสดงแมตช์วันนี้จัดกลุ่มตามลีก
        async function showTodayMatchesByLeague() {
            setActiveButton(event?.target);
            showLoading();
            currentView = 'today-by-league';

            try {
                const response = await fetch('/api/matches/today/by-league');
                if (!response.ok) throw new Error('Network response was not ok');

                const groupedData = await response.json();
                displayMatchesByLeague(groupedData, 'แมตช์วันนี้จัดกลุ่มตามลีก');

            } catch (error) {
                console.error('Error fetching matches by league:', error);
                showError('ไม่สามารถดึงข้อมูลแมตช์จัดกลุ่มตามลีกได้');
            }
        }

        // แสดงแมตช์ที่ยังไม่เริ่ม (SCHEDULED) จัดกลุ่มตามลีก
        async function showScheduledMatches() {
            setActiveButton(event?.target);
            showLoading();
            currentView = 'scheduled';

            try {
                const response = await fetch('/api/matches/today/scheduled/by-league');
                if (!response.ok) throw new Error('Network response was not ok');

                const groupedData = await response.json();
                displayMatchesByLeague(groupedData, `🗓️ แมตช์ที่ยังไม่เริ่ม (${groupedData.scheduledMatches} คู่)`);

            } catch (error) {
                console.error('Error fetching scheduled matches:', error);
                showError('ไม่สามารถดึงข้อมูลแมตช์ที่ยังไม่เริ่มได้');
            }
        }

        // แสดงสถิติ
        async function showStats() {
            setActiveButton(event?.target);
            showLoading();
            currentView = 'stats';

            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();
                displayStats(stats);
            } catch (error) {
                showError('ไม่สามารถโหลดสถิติได้');
            }
        }

        // ค้นหาทีม
        async function searchTeam(teamName = null) {
            const searchTerm = teamName || document.getElementById('searchInput').value;
            if (!searchTerm.trim()) {
                alert('กรุณาใส่ชื่อทีมที่ต้องการค้นหา');
                return;
            }

            showLoading();
            try {
                const response = await fetch(`/api/search/${encodeURIComponent(searchTerm)}`);
                const matches = await response.json();
                displayMatches(matches, `ผลการค้นหา: ${searchTerm}`);
            } catch (error) {
                showError('ไม่พบข้อมูลทีมที่ค้นหา');
            }
        }

        // กด Enter ในช่องค้นหา
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchTeam();
            }
        });

        // ส่งออกข้อมูล
        async function exportData() {
            try {
                const response = await fetch('/api/export');
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `football-data-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                window.URL.revokeObjectURL(url);
            } catch (error) {
                alert('ไม่สามารถส่งออกข้อมูลได้');
            }
        }

        // แสดงข้อมูลแมตช์
        function displayMatches(matches, title) {
            const content = document.getElementById('content');

            if (!matches || matches.length === 0) {
                content.innerHTML = `
                    <div class="no-matches">
                        <i class="fas fa-futbol" style="font-size: 3rem; margin-bottom: 20px;"></i>
                        <h3>${title}</h3>
                        <p>ไม่มีข้อมูลแมตช์ในขณะนี้</p>
                    </div>
                `;
                return;
            }

            let html = `<h2 style="color: white; text-align: center; margin-bottom: 20px;">${title} (${matches.length} แมตช์)</h2>`;

            // จัดกลุ่มแมตช์ตามวันที่
            function groupMatchesByDate(matches) {
                const grouped = {};
                matches.forEach(match => {
                    const date = new Date(match.startTime).toLocaleDateString('th-TH', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                    if (!grouped[date]) {
                        grouped[date] = [];
                    }
                    grouped[date].push(match);
                });
                return grouped;
            }

            // แสดงแมตช์ที่จัดกลุ่มแล้ว
            function displayGroupedMatches(groupedMatches, title) {
                const content = document.getElementById('content');

                const totalMatches = Object.values(groupedMatches).reduce((sum, matches) => sum + matches.length, 0);

                if (totalMatches === 0) {
                    content.innerHTML = `
                    <div class="no-matches">
                        <i class="fas fa-calendar-week" style="font-size: 3rem; margin-bottom: 20px;"></i>
                        <h3>${title}</h3>
                        <p>ไม่มีข้อมูลแมตช์ในขณะนี้</p>
                    </div>
                `;
                    return;
                }

                let html = `<h2 style="color: white; text-align: center; margin-bottom: 20px;">${title} (${totalMatches} แมตช์)</h2>`;

                Object.keys(groupedMatches).forEach(date => {
                    const matches = groupedMatches[date];
                    html += `
                    <div style="margin-bottom: 30px;">
                        <h3 style="color: #ffeb3b; margin-bottom: 15px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px; text-align: center;">
                            📅 ${date} (${matches.length} แมตช์)
                        </h3>
                        <div class="matches-grid">
                `;

                    matches.forEach(match => {
                        html += createMatchCard(match);
                    });

                    html += `
                        </div>
                    </div>
                `;
                });

                content.innerHTML = html;
            }

            // แสดงข้อมูลลีก
            function displayLeagues(leagues, title) {
                const content = document.getElementById('content');

                if (!leagues || leagues.length === 0) {
                    content.innerHTML = `
                    <div class="no-matches">
                        <i class="fas fa-trophy" style="font-size: 3rem; margin-bottom: 20px; color: #ffd700;"></i>
                        <h3>${title}</h3>
                        <p>ไม่มีข้อมูลลีกในขณะนี้</p>
                    </div>
                `;
                    return;
                }

                let html = `<h2 style="color: white; text-align: center; margin-bottom: 20px;">${title} (${leagues.length} ลีก)</h2>`;
                html += '<div class="leagues-grid">';

                leagues.forEach(league => {
                    html += createLeagueCard(league);
                });

                html += '</div>';
                content.innerHTML = html;
            }
            html += '<div class="matches-grid">';

            matches.forEach(match => {
                html += createMatchCard(match);
            });

            html += '</div>';
            content.innerHTML = html;
        }

        // แสดงแมตช์จัดกลุ่มตามลีก
        function displayMatchesByLeague(groupedData, title) {
            const content = document.getElementById('content');

            if (!groupedData || groupedData.totalMatches === 0) {
                content.innerHTML = `
                    <div class="no-matches">
                        <i class="fas fa-layer-group" style="font-size: 3rem; margin-bottom: 20px; color: #667eea;"></i>
                        <h3>${title}</h3>
                        <p>ไม่มีข้อมูลการแข่งขันในวันนี้</p>
                    </div>
                `;
                return;
            }

            let html = `
                <h2 style="color: white; text-align: center; margin-bottom: 20px;">
                    ${title}
                    <span style="color: #ffeb3b;">(${groupedData.totalMatches} คู่ใน ${groupedData.leagueGroups.length} ลีก)</span>
                </h2>
                <div style="color: white; text-align: center; margin-bottom: 30px; opacity: 0.8;">
                    📅 ${groupedData.dateRange}
                </div>
            `;

            groupedData.leagueGroups.forEach(leagueGroup => {
                html += `
                    <div class="league-group" style="margin-bottom: 40px;">
                        <div class="league-group-header" style="
                            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                            color: white;
                            padding: 15px 20px;
                            border-radius: 12px;
                            margin-bottom: 20px;
                            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
                        ">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <h3 style="margin: 0; font-size: 1.3rem;">
                                        🏆 ${leagueGroup.leagueName}
                                    </h3>
                                    ${leagueGroup.leagueNameEn !== leagueGroup.leagueName ?
                        `<p style="margin: 5px 0 0 0; opacity: 0.8; font-size: 0.9rem;">${leagueGroup.leagueNameEn}</p>` :
                        ''
                    }
                                </div>
                                <div style="text-align: right;">
                                    <div style="
                                        background: rgba(255,255,255,0.2);
                                        padding: 8px 15px;
                                        border-radius: 20px;
                                        font-weight: 600;
                                    ">
                                        ${leagueGroup.matchCount} คู่
                                    </div>
                                    ${leagueGroup.priority > 0 ?
                        `<small style="opacity: 0.7;">Priority: ${leagueGroup.priority}</small>` :
                        ''
                    }
                                </div>
                            </div>
                        </div>

                        <div class="matches-grid">
                `;

                leagueGroup.matches.forEach(match => {
                    html += createMatchCard(match);
                });

                html += `
                        </div>
                    </div>
                `;
            });

            content.innerHTML = html;
        }

        // สร้างการ์ดแมตช์
        function createMatchCard(match) {
            const time = new Date(match.time).toLocaleTimeString('th-TH', {
                hour: '2-digit',
                minute: '2-digit'
            });

            const statusClass = getStatusClass(match.status);
            const statusText = getStatusText(match.status);

            return `
                <div class="match-card">
                    <div class="match-header">
                        <div class="match-time">${time}</div>
                        <div class="match-status ${statusClass}">${statusText}</div>
                    </div>

                    <div class="teams-container">
                        <div class="team">
                            <div class="team-flag">${getCountryFlag(match.homeTeam)}</div>
                            <div class="team-name">${match.homeTeam}</div>
                        </div>

                        <div class="score-container">
                            <div class="score">${match.homeScore || 0} - ${match.awayScore || 0}</div>
                            <div class="vs">VS</div>
                        </div>

                        <div class="team">
                            <div class="team-flag">${getCountryFlag(match.awayTeam)}</div>
                            <div class="team-name">${match.awayTeam}</div>
                        </div>
                    </div>

                    ${match.league ? `<div class="league-badge">${match.league}</div>` : ''}
                </div>
            `;
        }

        // สร้างการ์ดลีก
        function createLeagueCard(league) {
            const displayName = league.name_th || league.name;
            const shortCode = league.shortCode ? `(${league.shortCode})` : '';

            return `
                <div class="league-card">
                    <div class="league-header">
                        <div class="league-trophy">
                            <i class="fas fa-trophy"></i>
                        </div>
                        <div class="league-priority">${league.priority || 0}</div>
                    </div>

                    <div class="league-content">
                        <h3 class="league-name">${displayName}</h3>
                        ${league.name_th && league.name !== league.name_th ?
                    `<p class="league-name-en">${league.name}</p>` :
                    ''
                }
                        ${shortCode ? `<p class="league-code">${shortCode}</p>` : ''}
                    </div>

                    <div class="league-footer">
                        <span class="league-status ${league.active ? 'active' : 'inactive'}">
                            ${league.active ? '🟢 ใช้งานได้' : '🔴 ไม่ใช้งาน'}
                        </span>
                    </div>
                </div>
            `;
        }

        // แสดงสถิติ
        function displayStats(stats) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <h2 style="color: white; text-align: center; margin-bottom: 30px;">สถิติผลการแข่งขัน</h2>
                <div class="stats-container">
                    <div class="stat-card">
                        <div class="stat-number">${stats.todayMatches || 0}</div>
                        <div class="stat-label">แมตช์วันนี้</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.weeklyStats?.totalMatches || 0}</div>
                        <div class="stat-label">แมตช์ทั้งสัปดาห์</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.weeklyStats?.completedMatches || 0}</div>
                        <div class="stat-label">แมตช์ที่เสร็จแล้ว</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.weeklyStats?.totalGoals || 0}</div>
                        <div class="stat-label">ประตูรวม</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.weeklyStats?.averageGoalsPerMatch || '0.00'}</div>
                        <div class="stat-label">เฉลี่ยประตู/แมตช์</div>
                    </div>
                </div>
            `;
        }

        // ฟังก์ชันช่วยเหลือ
        function showLoading() {
            document.getElementById('content').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    กำลังโหลดข้อมูล...
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="no-matches">
                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; margin-bottom: 20px; color: #ff6b6b;"></i>
                    <h3>เกิดข้อผิดพลาด</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        function setActiveButton(button) {
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            if (button && button.classList.contains('btn')) {
                button.classList.add('active');
            }
        }

        function getStatusClass(status) {
            switch (status?.toLowerCase()) {
                case 'ft':
                case 'finished':
                    return 'status-ft';
                case 'live':
                case '1h':
                case '2h':
                    return 'status-live';
                default:
                    return 'status-scheduled';
            }
        }

        function getStatusText(status) {
            switch (status?.toLowerCase()) {
                case 'ft':
                case 'finished':
                    return 'เสร็จแล้ว';
                case 'live':
                    return 'สด';
                case '1h':
                    return 'ครึ่งแรก';
                case '2h':
                    return 'ครึ่งหลัง';
                case 'ht':
                    return 'พักครึ่ง';
                default:
                    return 'ยังไม่เริ่ม';
            }
        }

        function getCountryFlag(teamName) {
            const flags = {
                'Brazil': '🇧🇷',
                'Argentina': '🇦🇷',
                'Chile': '🇨🇱',
                'Uruguay': '🇺🇾',
                'Paraguay': '🇵🇾',
                'Bolivia': '🇧🇴',
                'Peru': '🇵🇪',
                'Ecuador': '🇪🇨',
                'Colombia': '🇨🇴',
                'Venezuela': '🇻🇪',
                'Thailand': '🇹🇭',
                'England': '🏴󐁧󐁢󐁥󐁮󐁧󐁿',
                'Spain': '🇪🇸',
                'Germany': '🇩🇪',
                'France': '🇫🇷',
                'Italy': '🇮🇹',
                'Portugal': '🇵🇹',
                'Netherlands': '🇳🇱',
                'Belgium': '🇧🇪'
            };
            return flags[teamName] || '⚽';
        }

        // Auto refresh ทุก 30 วินาที
        setInterval(() => {
            if (currentView === 'today') {
                showTodayMatches();
            } else if (currentView === 'live') {
                showLiveMatches();
            }
        }, 30000);
    </script>
</body>

</html>
